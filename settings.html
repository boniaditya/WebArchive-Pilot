<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebArchive Pilot settings</title><style>body{margin:0;padding:32px;background:#f5f6f8;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:680px;margin:auto;background:#fff;border:1px solid #d8dbe2;border-radius:16px;padding:28px}label{display:block;margin:22px 0 7px;font-weight:600}input,textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #b8b8bf;border-radius:8px;font:inherit}textarea{min-height:130px}button{margin-top:22px;padding:11px 16px;border:0;border-radius:9px;background:#0a7cff;color:#fff;font:inherit;font-weight:600}p{color:#667085}#status{color:#1f6f35}</style></head><body><main><h1>WebArchive Pilot settings</h1><p>Control same-domain website crawling.</p><form id="settingsForm"><label for="maxPages">Maximum pages per bundle</label><input id="maxPages" type="number" min="1" max="500" required><label for="exceptions">Exceptions (one per line)</label><textarea id="exceptions" placeholder="/logout&#10;/private&#10;admin.example.com"></textarea><p>URLs containing one of these values are skipped.</p><button type="submit">Save settings</button><p id="status" role="status"></p></form></main><script src="settings.js"></script></body></html>
