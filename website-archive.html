<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose website pages · WebArchive Pilot</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f6f8;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1400px;margin:auto}h1{margin:0 0 6px}p{color:#667085}button{padding:10px 15px;border:0;border-radius:8px;background:#0a7cff;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.progress{display:none;margin:18px 0}.track{height:7px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#0a7cff;transition:width .25s}.log{max-height:100px;overflow:auto;font:12px ui-monospace,monospace;color:#667085}.chooser{display:grid;grid-template-columns:380px minmax(0,1fr);height:68vh;border:1px solid #d8dbe2;border-radius:14px;overflow:hidden;background:#fff}.chooser[hidden]{display:none}.left{overflow:auto;border-right:1px solid #d8dbe2;padding:12px}.left-head{position:sticky;top:0;background:#fff;padding:4px 0 10px;z-index:1}.link-row{display:flex;gap:9px;padding:10px 8px;border-radius:8px;cursor:pointer}.link-row:hover,.link-row.active{background:#eaf3ff}.link-row span{min-width:0}.link-row strong,.link-row small{display:block;overflow:hidden;text-overflow:ellipsis}.link-row small{color:#667085;margin-top:3px;white-space:nowrap}.preview{width:100%;height:100%;border:0;background:#fff}@media(max-width:800px){.chooser{grid-template-columns:1fr}.preview{display:none}}</style></head>
<body><main><h1>Choose website pages</h1><p>First crawl the website and review its links. No offline files are saved until you select pages and click Save selected pages.</p><button id="start">Crawl website</button><section class="progress" id="progress"><div class="track"><div class="fill" id="fill"></div></div><p id="status" role="status">Preparing…</p><div class="log" id="log"></div></section><section class="chooser" id="chooser" hidden><aside class="left"><div class="left-head"><button id="save">Save selected pages</button></div><div id="links"></div></aside><iframe class="preview" id="preview" title="Live page preview"></iframe></section></main><script src="website-archive.js"></script></body></html>
