<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose website pages · WebArchive Pilot</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f6f8;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1400px;margin:auto}h1{margin:0 0 6px}p{color:#667085}button{padding:10px 15px;border:0;border-radius:8px;background:#0a7cff;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#1266b4;border:1px solid #9bc8f5}button:disabled{opacity:.55}.progress{display:none;margin:18px 0}.track{height:7px;background:#e5e7eb;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#0a7cff;transition:width .25s}.log{max-height:120px;overflow:auto;font:12px ui-monospace,monospace;color:#667085}.chooser{display:grid;grid-template-columns:420px minmax(0,1fr);height:68vh;border:1px solid #d8dbe2;border-radius:14px;overflow:hidden;background:#fff}.chooser[hidden]{display:none}.left{overflow:auto;border-right:1px solid #d8dbe2;padding:12px}.left-head{position:sticky;top:0;background:#fff;padding:4px 0 10px;z-index:2}.actions,.options{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.options{margin-top:8px}.options label{display:flex;align-items:center;gap:4px;font-size:12px;color:#475467}.filter{width:100%;margin-top:8px;padding:9px 10px;border:1px solid #b8c0cc;border-radius:8px;font:inherit}.result-count{margin:8px 0 2px;font-size:12px;color:#667085}.domain-heading{margin:12px 6px 4px;color:#344054;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.link-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:9px;padding:10px 8px;border-radius:8px;cursor:pointer}.link-row[hidden]{display:none}.link-row:hover,.link-row.active{background:#eaf3ff}.link-copy{min-width:0}.link-copy strong,.link-copy small{display:block;overflow:hidden;text-overflow:ellipsis}.link-copy small{color:#667085;margin-top:3px;white-space:nowrap}.link-actions{display:flex;gap:7px;align-items:center}.link-icon{padding:1px!important;border:0!important;border-radius:0!important;background:transparent!important;color:#1266b4!important;font:700 17px/1 sans-serif!important}.link-icon.delete{color:#b42318!important;font-size:15px!important}.link-icon:hover{opacity:.65}.preview{width:100%;height:100%;border:0;background:#fff}@media(max-width:800px){.chooser{grid-template-columns:1fr}.preview{display:none}}</style></head>
<body><main><h1>Choose website pages</h1><p>First crawl the website and review its links. No offline files are saved until you select pages and click Save selected pages.</p><div class="actions"><button id="start">Crawl website</button><button class="secondary" id="more" type="button" hidden>Crawl more pages</button><button class="secondary" id="toggleLog" type="button">Hide log</button></div><section class="progress" id="progress"><div class="track"><div class="fill" id="fill"></div></div><p id="status" role="status">Preparing…</p><div class="log" id="log"></div></section><section class="chooser" id="chooser" hidden><aside class="left"><div class="left-head"><div class="actions"><button id="save">Save selected pages</button><button class="secondary" id="saveLinks" type="button">Save selected links</button><button class="secondary" id="selectVisible" type="button">Select visible</button><button class="secondary" id="copyVisible" type="button">Copy links</button></div><input class="filter" id="filter" type="search" placeholder="Filter links by URL or page title"><div class="options"><label><input id="hideDuplicates" type="checkbox" checked> Hide duplicates</label><label><input id="groupByDomain" type="checkbox"> Group by domain</label></div><div class="result-count" id="resultCount"></div></div><div id="links"></div></aside><iframe class="preview" id="preview" sandbox="" referrerpolicy="no-referrer" title="Rendered page preview"></iframe></section></main><script type="module" src="website-archive.js"></script></body></html>
