<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive database · WebArchive Pilot</title><style>body{margin:0;background:#f5f6f8;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{height:100vh;display:grid;grid-template-columns:380px 1fr}aside{padding:24px 18px;overflow:auto;border-right:1px solid #d8dbe2;background:#fff}h1{margin:0}.intro{color:#667085;line-height:1.4}.folder{margin:16px 0;background:#f8fafc;border:1px solid #d8dbe2;border-radius:12px;overflow:hidden}.folder-head{padding:13px 14px;border-bottom:1px solid #e5e7eb}.folder-head a{font-weight:700;color:#0a67c7;overflow-wrap:anywhere}.thread{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #edf0f3;cursor:pointer}.thread:hover,.thread.selected{background:#e8f2ff}.thread:last-child{border-bottom:0}.thread a{color:#1d1d1f;font-weight:600;text-decoration:none;overflow-wrap:anywhere}.meta{color:#667085;font-size:11px;margin-left:auto;white-space:nowrap}.empty,.error{padding:18px;color:#667085}.preview{padding:0;background:#eef1f5}.preview iframe{width:100%;height:100%;border:0;background:#fff}.preview-placeholder{height:100%;display:grid;place-items:center;color:#667085}@media(max-width:800px){.shell{grid-template-columns:1fr}.preview{display:none}}</style></head><body><div class="shell"><aside><h1>Archive database</h1><p class="intro">Select a bundle thread to preview it on the right.</p><div id="content">Loading database…</div></aside><section class="preview" id="preview"><div class="preview-placeholder">Select a saved .zarc bundle.</div></section></div><script type="module" src="database.js"></script></body></html>
